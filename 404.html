<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>404 — Página não encontrada | KL COM</title>
<link rel="canonical" href="https://klcom.netlify.app/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="preload" href="fonts/geist-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/geist-latin-800.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Geist";font-weight:400;font-display:swap;src:url("fonts/geist-latin-400.woff2")format("woff2")}
@font-face{font-family:"Geist";font-weight:800;font-display:swap;src:url("fonts/geist-latin-800.woff2")format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#000;--fg:#e8e8e8;--red:#ff2222;--dim:#666;--sans:"Geist",-apple-system,system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1)}
html{color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);height:100vh;height:100svh;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 8vw;overflow:hidden;position:relative}
body::after{content:"";position:fixed;inset:0;z-index:999;pointer-events:none;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px 128px}
.glow{position:absolute;top:40%;left:30%;width:520px;height:520px;background:radial-gradient(circle,rgba(255,34,34,.07) 0%,transparent 70%);transform:translate(-50%,-50%);pointer-events:none}
h1{font-size:clamp(90px,26vw,280px);font-weight:800;letter-spacing:-.05em;line-height:.8;text-transform:uppercase;position:relative;z-index:2}
h1 .dot{color:var(--red)}
p.sub{margin-top:22px;color:var(--dim);max-width:38ch;line-height:1.7;position:relative;z-index:2;font-size:clamp(15px,2vw,19px)}
p.sub b{color:var(--fg);font-weight:600}
.cta{margin-top:44px;display:flex;gap:14px;flex-wrap:wrap;position:relative;z-index:2}
a{display:inline-block;padding:16px 34px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;transition:.35s var(--ease);cursor:pointer}
a.primary{background:var(--red);color:#000}
a.primary:hover{background:transparent;border:1px solid var(--red);color:#fff;padding:15px 33px}
a.ghost{border:1px solid rgba(255,255,255,.16);color:var(--fg)}
a.ghost:hover{border-color:var(--red);color:#fff}
.code{margin-top:52px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.22);position:relative;z-index:2}
@media(max-width:768px){body{padding:0 24px}.cta{width:100%}a{flex:1;text-align:center}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="glow"></div>
<h1>40<span class="dot">4</span></h1>
<p class="sub">O caminho terminou aqui.<br>
<b>O que você procura não existe nesta URL.</b></p>
<div class="cta">
  <a class="primary" href="/">VOLTAR AO INÍCIO</a>
  <a class="ghost" href="/portfolio.html">VER PORTFÓLIO</a>
</div>
<div class="code">ERRO 404 · KL COM</div>
</body>
</html>
