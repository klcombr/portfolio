<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>404 — Página não encontrada | KL COM</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/geist-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/geist-latin-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/base.css">
<style>
  .nf{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding-block:6rem 4rem;
  }
  .nf__eyebrow{margin-bottom:1.5rem}
  .nf__code{
    font-size:clamp(5rem,3rem + 16vw,13rem);
    font-weight:800;
    line-height:.85;
    letter-spacing:-.05em;
  }
  .nf__code em{font-style:normal;color:var(--accent)}
  .nf__msg{margin-top:2rem;max-width:38ch;color:var(--fg-muted);line-height:1.7}
  .nf__msg b{color:var(--fg);font-weight:600}
  .nf__actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2.5rem}
  .nf__foot{
    margin-top:3.5rem;
    font-family:var(--mono);
    font-size:var(--t-xs);
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--fg-subtle);
  }
  @media (max-width:640px){
    .nf__actions{flex-direction:column;align-items:stretch}
  }
</style>
</head>
<body>
<main class="nf">
  <div class="shell">
    <p class="eyebrow nf__eyebrow">Erro 404</p>
    <h1 class="nf__code">4<em>0</em>4</h1>
    <p class="nf__msg">
      O caminho terminou aqui.<br>
      <b>O que você procura não existe nesta URL.</b>
    </p>
    <div class="nf__actions">
      <a class="btn btn--solid" href="/">Voltar ao início</a>
      <a class="btn btn--ghost" href="/curriculo.html">Ver currículo</a>
    </div>
    <p class="nf__foot">KL COM — Kauê Monteiro</p>
  </div>
</main>
</body>
</html>
